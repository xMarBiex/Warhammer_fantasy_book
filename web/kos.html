<title>KOS — Warhammer Fantasy (test całej bazy)</title>
<style>
  :root{
    --bg:#14110d; --panel:#211b13; --panel2:#2a2318; --line:#3a3020; --line2:#4a3d27;
    --ink:#e9e0cb; --dim:#b6a98c; --faint:#8a7d63; --gold:#c8a24a; --rust:#a2482f;
    --ok:#6f9d5b; --warn:#c98a2f; --blue:#6f86b0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 "Iowan Old Style",Georgia,"Times New Roman",serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:820px;margin:0 auto;padding:16px 14px 60px}
  header{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
  h1{font-size:1.4rem;margin:0 0 2px;color:var(--gold);letter-spacing:.5px}
  .sub{color:var(--faint);font-size:.82rem}
  .search{position:sticky;top:0;background:var(--bg);padding:10px 0 8px;z-index:5}
  #q{width:100%;padding:12px 14px;font-size:1.05rem;color:var(--ink);
    background:var(--panel);border:1px solid var(--line2);border-radius:10px;outline:none}
  #q:focus{border-color:var(--gold)}
  .hints{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .hint{font-size:.78rem;color:var(--dim);background:var(--panel);border:1px solid var(--line);
    padding:4px 9px;border-radius:20px;cursor:pointer}
  .hint:hover{border-color:var(--gold);color:var(--ink)}
  .card{background:var(--panel);border:1px solid var(--line2);border-radius:12px;
    padding:13px 15px;margin:11px 0}
  .card h2{margin:0 0 2px;font-size:1.16rem;color:var(--gold)}
  .meta{color:var(--faint);font-size:.8rem;margin-bottom:9px}
  .badge{display:inline-block;font-size:.68rem;padding:2px 8px;border-radius:20px;
    border:1px solid var(--line2);color:var(--dim);margin-left:6px;vertical-align:middle;text-transform:uppercase;letter-spacing:.5px}
  .badge.q{color:var(--gold);border-color:var(--gold)}
  .conf{float:right;font-size:.74rem;color:var(--ok)}
  table.stats{width:100%;border-collapse:collapse;margin:5px 0 3px}
  table.stats td{border:1px solid var(--line);padding:4px 3px;text-align:center;font-size:.86rem}
  table.stats td.k{color:var(--faint);font-size:.68rem;background:var(--panel2)}
  .none{color:#6a5f48}
  .lbl{color:var(--gold);font-size:.76rem;text-transform:uppercase;letter-spacing:.6px;margin:11px 0 3px}
  .txt{color:var(--dim);font-size:.9rem}
  .row2{display:flex;flex-wrap:wrap;gap:6px 18px;margin:2px 0}
  .kv{font-size:.92rem}.kv b{color:var(--ink)}.kv span{color:var(--dim)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .chip{font-size:.84rem;padding:3px 10px;border-radius:20px;cursor:pointer;
    background:var(--panel2);border:1px solid var(--line2);color:var(--ink)}
  .chip:hover{border-color:var(--gold)}
  .chip.miss{cursor:not-allowed;color:var(--warn);border-color:var(--warn);opacity:.8}
  .chip.miss::after{content:" ⚠"}
  .chip.sp{color:var(--dim)}
  .arrow{color:var(--faint);font-size:.8rem;margin-right:4px}
  .empty{color:var(--faint);text-align:center;padding:26px 10px}
  .warnbox{background:#2a2013;border:1px solid var(--warn);border-radius:10px;
    padding:10px 12px;margin:11px 0;font-size:.86rem;color:var(--dim)}
  .foot{color:var(--faint);font-size:.76rem;text-align:center;margin-top:22px;
    border-top:1px solid var(--line);padding-top:12px}
  .tcount{color:var(--gold)}
</style>

<div class="wrap">
  <header>
    <h1>Warhammer Fantasy — KOS</h1>
    <div class="sub">Test całej bazy strukturalnej: profesje, broń, pancerz, czary,
      ekwipunek, bestiariusz + zależności (kto zna daną umiejętność). Dane z SQL/Grafu.</div>
  </header>
  <div class="search">
    <input id="q" placeholder="Szukaj: profesja, broń, czar, przedmiot, potwór, umiejętność…"
      autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="hints" id="hints"></div>
  </div>
  <div id="out"></div>
  <div class="foot" id="foot"></div>
</div>

a":"10 s / 4 zk","obciazenie":"—","dostepnosc":"przeciętna","page":125},{"name":"Wózek","kategoria":"Pojazdy","cena":"50 zk","obciazenie":"—","dostepnosc":"przeciętna","page":123},{"name":"Wózek lub wóz (przejazd)","kategoria":"Usługi transportowe","cena":"1 p / 15 p","obciazenie":"—","dostepnosc":"duża","page":125},{"name":"Wół","kategoria":"Inwentarz żywy","cena":"30 zk","obciazenie":"—","dostepnosc":"duża","page":123},{"name":"Zapałka","kategoria":"Oświetlenie","cena":"1 p","obciazenie":"—","dostepnosc":"mała","page":119},{"name":"Łódź rzeczna","kategoria":"Pojazdy","cena":"600 zk","obciazenie":"—","dostepnosc":"rzadka","page":123},{"name":"Łódź rzeczna (przejazd)","kategoria":"Usługi transportowe","cena":"1 s / 5 s","obciazenie":"—","dostepnosc":"duża","page":125},{"name":"Łódź wiosłowa","kategoria":"Pojazdy","cena":"90 zk","obciazenie":"900","dostepnosc":"mała","page":123},{"name":"Ślina chimery","kategoria":"Trucizny","cena":"150 zk","obciazenie":"—","dostepnosc":"znikoma","page":126},{"name":"Świeczka woskowa","kategoria":"Oświetlenie","cena":"6 s","obciazenie":"5","dostepnosc":"mała","page":119},{"name":"Świeczka łojowa","kategoria":"Oświetlenie","cena":"3 s","obciazenie":"5","dostepnosc":"duża","page":119},{"name":"Świnia","kategoria":"Inwentarz żywy","cena":"3 zk","obciazenie":"—","dostepnosc":"duża","page":123}],"spells":[{"name":"Akceptacja przeznaczenia","tradycja":"Tradycja Śmierci","pm":14,"czas_rzucania":"3 akcje","zasieg":"","czas_trwania":"1 minuta (6 rund)","skladnik":"gwóźdź z trumny (+2)","opis":"Wszyscy towarzysze czarodzieja w promieniu 12 metrów przestają bać się śmierci — w trakcie trwania czaru są traktowani, jakby posiadali zdolność nieustraszony.","page":162},{"name":"Aura odwagi","tradycja":"Magia kapłańska: Sigmar","pm":14,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"pryzmat (+2)","opis":"Majestat Sigmara przepełnia kapłana, który jaśnieje aurą męstwa i niezłomnej wiary. Na jego widok wszyscy towarzysze ogarnięci Strachem lub Grozą opanowują się i mogą działać normalnie.","page":174},{"name":"Bicz wodny","tradycja":"Magia kapłańska: Manann","pm":10,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"fiolka wypełniona wodą morską (+1)","opis":"Z wyciągniętych dłoni kapłana tryskają strumienie morskiej wody, uderzając w dowolnego przeciwnika w odległości do 36 metrów. To magiczny pocisk o Sile 4; trafiona postać musi zdać test Krzepy, inaczej pada na ziemię.","page":171},{"name":"Bitewny szał","tradycja":"Magia kapłańska: Ulryk","pm":7,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"liczba minut równa wartości Magii kapłana","skladnik":"odrobina świeżej krwi (+1)","opis":"W kapłana wstępuje duch Ulryka, wzbudzając w nim żądzę krwi: +1 do Ataków, ale zawsze musi atakować najbliższego przeciwnika (wykonując «szarżę», «szaleńczy atak» lub «atak wielokrotny») i nie może uciekać ani wykonać akcji «odwrót».","page":175},{"name":"Błogosławiony rejs","tradycja":"Magia kapłańska: Manann","pm":5,"czas_rzucania":"1 minuta","zasieg":"","czas_trwania":"jedna podróż morska (do zawinięcia do portu)","skladnik":"flaszka wina (+1)","opis":"Na początku morskiej podróży kapłan modli się do Mananna o przychylność i opiekę. Jak długo kapłan pozostaje na pokładzie statku, wszystkie testy nawigacji wykonywane są z modyfikatorem +10.","page":171},{"name":"Błyskawica","tradycja":"Tradycja Niebios","pm":10,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"kamerton (+1)","opis":"Czarodziej ciska błyskawicą w przeciwnika w odległości do 36 metrów. Magiczny pocisk o Sile 5.","page":159},{"name":"Całun niewidzialności","tradycja":"Tradycja Cienia","pm":17,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"1k10 rund","skladnik":"nić babiego lata (+2)","opis":"Czarodziej otacza się mocą Ulgu i staje się niewidzialny: nie może być celem broni strzeleckiej ani magicznych pocisków, +20 do Walki Wręcz. Postacie w promieniu 4 metrów mogą go wykryć Trudnym (-20) testem spostrzegawczości; wtedy atakują z modyfikatorem -30. Tylko na siebie.","page":158},{"name":"Chodzenie po wodzie","tradycja":"Magia kapłańska: Manann","pm":14,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"liczba minut równa wartości Magii kapłana","skladnik":"wyschnięty żuk wodny (+2)","opis":"Bóg morza tchnie w kapłana moc chodzenia po wodzie, mokradłach i bagnach — kapłan może poruszać się po takim terenie tak, jakby stąpał po twardym gruncie.","page":171},{"name":"Cisza morska","tradycja":"Magia kapłańska: Manann","pm":16,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"1 godzina","skladnik":"sztylet z fiszbinu wieloryba (+2)","opis":"Kapłan modli się do Mananna i wskazuje dowolny statek w odległości do 96 metrów — w jego pobliżu natychmiast cichnie wiatr, a żagle opadają bezwładnie. Jeśli statek nie ma wioseł, do końca trwania czaru stoi w miejscu lub dryfuje z prądami.","page":171},{"name":"Dar Ulryka","tradycja":"Magia kapłańska: Ulryk","pm":15,"czas_rzucania":"3 akcje","zasieg":"","czas_trwania":"1 godzina","skladnik":"topór (+2)","opis":"Kapłan wzywa moc Ulryka, która napełnia bitewnym duchem jego towarzyszy. W trakcie trwania czaru są odporni na Strach i Grozę oraz na efekty umiejętności zastraszanie i zdolności niepokojący.","page":175},{"name":"Do ostatniego tchu","tradycja":"Tradycja Śmierci","pm":20,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"liczba minut równa wartości Magii czarodzieja","skladnik":"fiolka z substancją balsamiczną (+2)","opis":"Wszyscy towarzysze czarodzieja w promieniu 24 metrów walczą jak natchnieni, czując się nieśmiertelni. Jeśli któryś odniesie śmiertelną ranę, może w swojej turze wykonać jeszcze jedną, ostatnią akcję — po jej rozpatrzeniu umiera.","page":163},{"name":"Dotyk Chaosu","tradycja":"Tradycja Chaosu","pm":20,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"róg zwierzoczłeka (+2)","opis":"Dotyk wtłacza czystą energię Chaosu w ciało dowolnej postaci (test Siły Woli; nieudany = błyskawiczna przemiana). Losowo wyznacz mutację Chaosu (Tabela 11-1, str. 240). Kolejny nieudany test Siły Woli oznacza ogłuszenie na 1 rundę. Czar dotykowy; nie działa na ożywieńców.","page":169},{"name":"Dotyk na odległość","tradycja":"Magia powszechna","pm":4,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"niewielki wachlarz (+1)","opis":"Adept siłą woli przesuwa każdy niezabezpieczony, lekki przedmiot (Obciążenie 10 lub niższe) na odległość do 12 metrów. Może też otworzyć lub zamknąć niezaryglowane drzwi albo przewracać przedmioty o Obciążeniu 50 lub mniejszym w odległości do 24 metrów.","page":155},{"name":"Dotyk śmierci","tradycja":"Tradycja Śmierci","pm":7,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"dwa miedziane pensy (+1)","opis":"Czarodziej dotyka ciężko rannej osoby, pomagając jej umrzeć. Zabija dowolną postać, która ma 0 punktów Żywotności i otrzymała przynajmniej 1 trafienie krytyczne. Czar dotykowy; działa na potwory, zwierzęta i innych BG. Odesłane dusze są odporne na czary typu «ostatnie słowa», lecz zwłoki wciąż można ożywić nekromancją.","page":162},{"name":"Drugie proroctwo Amul","tradycja":"Tradycja Niebios","pm":12,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"1 godzina lub do wykorzystania obu przerzutów","skladnik":"odłamek barwionego szkła (+2)","opis":"Działa podobnie jak Pierwsze proroctwo Amul, lecz gracz może przerzucić wyniki dowolnych dwóch kostek.","page":160},{"name":"Gejzer","tradycja":"Tradycja Życia","pm":22,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"1 godzina","skladnik":"różdżka do poszukiwania wody, poświęcona przez kapłana Taala (+3)","opis":"Z pokrytego ziemią obszaru w odległości do 24 metrów tryska gejzer. Wszystkie postacie w promieniu 3 metrów otrzymują trafienie o Sile 4, zostają odrzucone o 4 metry i muszą zdać test Odporności; nieudany = ogłuszone na 1k10 rund.","page":166},{"name":"Geniusz taktyczny","tradycja":"Magia kapłańska: Myrmidia","pm":7,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"liczba minut równa wartości Magii kapłana","skladnik":"buława (+1)","opis":"Kapłan otacza się aurą męstwa działającą pokrzepiająco na towarzyszy: +20 do testów dowodzenia i nauki (taktyka/strategia). Dodatkowo towarzysze w promieniu 12 metrów mogą powtórzyć każdy nieudany test Strachu lub Grozy.","page":172},{"name":"Gorejący miecz","tradycja":"Tradycja Ognia","pm":14,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"liczba rund równa wartości Magii (można przedłużać udanym testem Siły Woli co rundę)","skladnik":"pochodnia (+2)","opis":"W dłoni czarodzieja pojawia się ognisty miecz — broń magiczna z cechą oręża «druzgoczący» i Siłą 4. Daje +1 do Ataków.","page":161},{"name":"Gorejący wzrok","tradycja":"Tradycja Światła","pm":7,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"","skladnik":"soczewka (+1)","opis":"Z oczu czarodzieja tryska promień oślepiającego światła, który trafia we wskazaną postać w odległości do 16 metrów. Magiczny pocisk o Sile 6.","page":163},{"name":"Groza wojny","tradycja":"Magia kapłańska: Myrmidia","pm":16,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"liczba rund równa wartości Magii kapłana","skladnik":"miedziana maska (+2)","opis":"Kapłan, obdarzony łaską Myrmidii, staje się przerażającym przeciwnikiem. Za każdym razem, gdy wykona udany atak w walce wręcz, jego przeciwnik musi wykonać test Grozy.","page":172},{"name":"Grzmot","tradycja":"Magia kapłańska: Taal i Rhya","pm":12,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"","skladnik":"niewielki gong (+2)","opis":"W dowolnym miejscu w odległości do 48 metrów rozlega się ogłuszający grzmot. Postacie w promieniu 5 metrów wykonują test Odporności; nieudany = ogłuszone na 1 rundę. Odgłos słyszalny jest w promieniu 1 kilometra.","page":174},{"name":"Gwiezdny blask","tradycja":"Tradycja Niebios","pm":22,"czas_rzucania":"3 akcje","zasieg":"","czas_trwania":"liczba minut równa wartości Magii czarodzieja","skladnik":"mapa gwiezdna (+3)","opis":"Czarodziej przywołuje światło gwiazd. Obszar w promieniu 48 metrów zostaje oświetlony łagodnym blaskiem, który rozprasza ciemność (zwykłą i magiczną), ujawnia niewidzialne postacie oraz odkrywa tajemne przejścia i skrytki.","page":160},{"name":"Głos pana","tradycja":"Tradycja Zwierząt","pm":13,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"1 runda","skladnik":"miniaturowy bicz ukręcony ze zwierzęcej sierści (+2)","opis":"Wykorzystując moc Ghur, czarodziej zmusza do posłuszeństwa dowolne zwierzę w odległości do 24 metrów. Zwierzę broni się testem Siły Woli; nieudany = w następnej rundzie jest całkowicie posłuszne rozkazom.","page":165},{"name":"Kajdany Vereny","tradycja":"Magia kapłańska: Verena","pm":6,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"żelazne kajdany (+1)","opis":"Czar tworzy niewidzialne kajdany unieruchamiające dowolną postać w zasięgu wzroku kapłana. Ofiara broni się testem Siły Woli; nieudany = traktowana jako bezbronna, nie może wykonywać akcji poza próbą rozerwania więzów (przeciwstawny test jej Krzepy i splatania magii kapłana).","page":175},{"name":"Klątwa","tradycja":"Tradycja Niebios","pm":16,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"24 godziny","skladnik":"pęknięte zwierciadło (+2)","opis":"Czarodziej rzuca klątwę na dowolną postać w odległości do 24 metrów: -10 do wszystkich testów, a wszystkie wymierzone w nią ataki zadają +1 obrażeń. Postać może być pod wpływem tylko jednej klątwy naraz.","page":160},{"name":"Klątwa albatrosa","tradycja":"Magia kapłańska: Manann","pm":19,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"1 minuta (6 rund)","skladnik":"pióro albatrosa (+2)","opis":"Kapłan kieruje klątwą Mananna przeciwko wrogom w odległości do 48 metrów. Wszystkie postacie w promieniu 5 metrów zostają objęte czarem; w trakcie jego trwania Wartość Krytyczna wszystkich trafień krytycznych zadanych tym postaciom zwiększa się o 2.","page":171},{"name":"Klątwa cierni","tradycja":"Tradycja Życia","pm":6,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"1k10 rund","skladnik":"cierń (+1)","opis":"W ciało dowolnej postaci w odległości do 36 metrów wrastają kolce, powodując okropny ból. Na początku każdej rundy postać wykonuje test Siły Woli; nieudany = traci 1 punkt Żywotności (bez względu na Wytrzymałość i zbroję) i ma -20 do wszystkich testów w tej rundzie.","page":166},{"name":"Klątwa starości","tradycja":"Tradycja Śmierci","pm":23,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"","skladnik":"gałązka bluszczu z mogiły kapłana (+2)","opis":"Dowolna postać w odległości do 12 metrów starzeje się w kilka sekund o całe lata. Broni się testem Siły Woli; nieudany = na stałe traci 1k10 Krzepy i Odporności. Nie działa na zwierzęta, demony, ożywieńców, rośliny ani przedmioty.","page":163},{"name":"Kojący dotyk","tradycja":"Magia kapłańska: Sigmar","pm":12,"czas_rzucania":"3 akcje","zasieg":"","czas_trwania":"","skladnik":"skórzana rękawica (+2)","opis":"Dotyk kapłana przywraca rannej postaci 1k10 punktów Żywotności. Czar dotykowy — kapłan może go rzucić również na siebie.","page":174},{"name":"Kolumna światłości","tradycja":"Tradycja Światła","pm":28,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"","skladnik":"diament o wartości min. 100 zk (+3)","opis":"Czarodziej splata energię Hysh w kolumnę oślepiającej jasności w dowolnym miejscu do 48 metrów. Wszystkie postacie w promieniu 5 metrów otrzymują trafienie o Sile 4 i muszą zdać test Zręczności; nieudany = zachowują się, jakby pod wpływem czaru Rozbłysk. Wyczuwalne przez czarodziejów w promieniu 5 kilometrów.","page":164},{"name":"Kometa Sigmara","tradycja":"Magia kapłańska: Sigmar","pm":16,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"złoty grot strzały (+2)","opis":"Kapłan kształtuje moc w płonący pocisk przybierający postać symbolu Sigmara. Miniaturowa kometa o dwóch ogonach uderza w dowolną postać w odległości do 24 metrów. To magiczny pocisk o Sile 6.","page":174},{"name":"Korozja","tradycja":"Tradycja Metalu","pm":9,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"zardzewiały ćwiek (+1)","opis":"Czarodziej sprawia, że dowolny metalowy przedmiot w odległości do 12 metrów koroduje i rdzewieje, stając się bezużyteczny. Celem może być obiekt o Obciążeniu 75 lub mniejszym.","page":158},{"name":"Kosa żniwiarza","tradycja":"Tradycja Śmierci","pm":8,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"liczba rund równa wartości Magii (można przedłużać udanym testem Siły Woli co rundę)","skladnik":"miniaturowa żelazna kosa (+1)","opis":"W ręku czarodzieja pojawia się kosa z ametystowej energii — broń magiczna o Sile 5 z cechą oręża «szybki». Władający nią czarodziej otrzymuje dodatkowo +10 do Walki Wręcz.","page":162},{"name":"Krew ziemi","tradycja":"Tradycja Życia","pm":9,"czas_rzucania":"1-10 akcji","zasieg":"","czas_trwania":"","skladnik":"sztylet (+1)","opis":"Czarodziej wchłania energię życiową z ziemi, na której stoi. Przywraca mu tyle punktów Żywotności, ile akcji przeznaczył na czar. Nie może nim uzdrowić innej postaci.","page":166},{"name":"Leczenie choroby","tradycja":"Magia kapłańska: Shallya","pm":11,"czas_rzucania":"3 akcje","zasieg":"","czas_trwania":"","skladnik":"kompres (+1)","opis":"Kapłan uzdrawia dowolną chorą postać — wszystkie efekty choroby natychmiast ustają. Nie wskrzesza postaci zmarłej na skutek choroby. Czar dotykowy.","page":173},{"name":"Leczenie obłędu","tradycja":"Magia kapłańska: Shallya","pm":20,"czas_rzucania":"1 godzina","zasieg":"","czas_trwania":"","skladnik":"kropidło (+2)","opis":"Łaska bogini napełnia kapłana mocą oczyszczania umysłów. Jego dotyk uzdrawia dowolną obłąkaną postać, lecząc ją z jednej choroby umysłu. Czar dotykowy.","page":173},{"name":"Leczenie ran","tradycja":"Magia kapłańska: Shallya","pm":6,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"pijawka (+1)","opis":"Dotyk kapłana uzdrawia dowolną postać, przywracając jej 1k10 punktów Żywotności plus tyle, ile wynosi wartość Magii kapłana. Czar dotykowy; można rzucić również na siebie.","page":173},{"name":"Letarg","tradycja":"Magia kapłańska: Morr","pm":20,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"1k10 rund","skladnik":"mała srebrna kosa (+2)","opis":"Kapłan wykorzystuje moc Morra, by uśpić dowolną grupę osób w odległości do 24 metrów. Wszystkie postacie w promieniu 5 metrów wykonują test Siły Woli; nieudany = zapadają w sen nie do odróżnienia od śmierci i są traktowane jako bezbronne.","page":172},{"name":"Lodowa zamieć","tradycja":"Magia kapłańska: Ulryk","pm":20,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"1 runda","skladnik":"sopel lodu (+2)","opis":"Kapłan przyzywa gwałtowną burzę miotającą lodowymi odłamkami. Magiczna chmura formuje się w dowolnym miejscu do 24 metrów; wszystkie postacie w promieniu 5 metrów otrzymują trafienie o Sile 5 i muszą zdać test Siły Woli, inaczej zostają ogłuszone na 1 rundę.","page":175},{"name":"Magiczna broń","tradycja":"Magia powszechna","pm":6,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"1 godzina","skladnik":"odrobina poświęconej wody (+1)","opis":"Adept zamyka moc Wiatrów Magii w dowolnej broni białej lub w maksymalnie pięciu pociskach broni strzeleckiej. Broń nie zadaje dodatkowych obrażeń, ale jest traktowana jak magiczna — może ranić duchy, upiory i potwory odporne na zwykły oręż.","page":155},{"name":"Magiczne zamknięcie","tradycja":"Magia powszechna","pm":7,"czas_rzucania":"1 minuta","zasieg":"","czas_trwania":"1 tydzień","skladnik":"mały klucz (+1)","opis":"Zaklęcie nakłada się na dowolny zamek (skobel, zasuwkę itp.) w odległości do 2 metrów. Chronionego zamka nie można otworzyć żadnym kluczem ani wytrychem, choć można wyważyć drzwi lub rozbić wieko kufra.","page":156},{"name":"Magiczny alarm","tradycja":"Magia powszechna","pm":8,"czas_rzucania":"1 minuta","zasieg":"","czas_trwania":"do wyzwolenia (naraz tylko jeden aktywny)","skladnik":"mosiężny dzwoneczek (+1)","opis":"Adept ogniskuje moc w wybranym miejscu. Jeśli ktokolwiek znajdzie się w odległości 2 metrów, adept odbiera przekaz mentalny (działa też, gdy śpi). Rzucenie kolejnego alarmu wygasza poprzedni; efekt kończy się po wyzwoleniu.","page":156},{"name":"Martwica","tradycja":"Tradycja Nekromancji","pm":19,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"1 minuta (6 rund)","skladnik":"kawałek ciała upiora (+3)","opis":"Moc Dhar przenika ciało nekromanty, nadając mu twardość zesztywniałego pośmiertnie trupa. W trakcie trwania czaru Wartość Krytyczna każdego trafienia krytycznego, jakie otrzyma, zmniejsza się o wartość jego Magii.","page":170},{"name":"Maska iluzji","tradycja":"Tradycja Cienia","pm":12,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"1k10 rund","skladnik":"szkic wyobrażający planowaną czynność (+2)","opis":"Czarodziej okrywa się iluzją pozwalającą wykonywać dowolne działania przy zachowaniu wrażenia, że robi coś zupełnie innego. Iluzja reaguje na jego ruchy; postać objęta działaniem może przejrzeć ją testem Inteligencji. Maskuje też sam fakt użycia magii.","page":157},{"name":"Metoda prób i błędów","tradycja":"Tradycja Metalu","pm":16,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"1 runda","skladnik":"pusta szklana fiolka (+2)","opis":"Czarodziej kieruje poczynaniami wszystkich towarzyszy w odległości do 12 metrów: każdy może przerzucić wynik pojedynczego testu lub rzutu na obrażenia. Wynik drugiego rzutu jest ostateczny.","page":159},{"name":"Miecz sprawiedliwości","tradycja":"Magia kapłańska: Verena","pm":10,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"1 minuta (6 rund)","skladnik":"amulet z wygrawerowaną wagą (+1)","opis":"Miecz kapłana staje się narzędziem Vereny — traktowany jako broń magiczna z cechą oręża «precyzyjny». Kapłan otrzymuje dodatkowo +10 do Walki Wręcz, gdy atakuje nią winnego popełnionej zbrodni (musi być przekonany o winie przeciwnika).","page":176},{"name":"Migotliwa tarcza","tradycja":"Tradycja Światła","pm":8,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"liczba minut równa wartości Magii czarodzieja","skladnik":"świeca (+1)","opis":"Wokół czarodzieja pojawia się świetlista sfera chroniąca go przed niemagicznymi pociskami: broń strzelecka wymierzona w niego ma Siłę zmniejszoną do 0 (obrażenia ustala się rzutem 1k10). Próby ukrywania się przez czarodzieja automatycznie kończą się porażką.","page":163},{"name":"Mowa zwierząt","tradycja":"Tradycja Zwierząt","pm":11,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"liczba minut równa wartości Magii czarodzieja","skladnik":"język zwierzęcia, w które chce się zmienić czarodziej (+2)","opis":"Czarodziej przemieniony w zwierzę nadal może mówić ludzkim głosem. Rzucony na dowolne zwierzę w odległości do 24 metrów pozwala mu przemawiać ludzkim głosem.","page":165},{"name":"Mroczna dłoń zniszczenia","tradycja":"Tradycja Chaosu","pm":17,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"liczba rund równa wartości Magii (można przedłużać udanym testem Siły Woli co rundę)","skladnik":"dłoń wisielca (+2)","opis":"Ręka czarnoksiężnika staje się magiczną bronią o Sile 7 z cechą oręża «przebijający zbroję». Przy atakach zaczarowaną ręką otrzymuje +10 do Walki Wręcz.","page":169},{"name":"Mroczne przeznaczenie","tradycja":"Tradycja Niebios","pm":31,"czas_rzucania":"1 godzina","zasieg":"","czas_trwania":"","skladnik":"pętla wisielca (+3)","opis":"Czarodziej splata surową moc Chaosu wokół pukla włosów lub kropli krwi dowolnej istoty w odległości do 1 kilometra, odmieniając jej przeznaczenie. Ofiara wykonuje Bardzo Trudny (-30) test Siły Woli; nieudany = traci 1 Punkt Przeznaczenia, a jeśli go nie ma, Wartość Krytyczna następnego trafienia w nią wzrasta o +10. Czar wyczuwają czarodzieje w promieniu 5 kilometrów.","page":160},{"name":"Mumifikacja","tradycja":"Magia kapłańska: Morr","pm":5,"czas_rzucania":"1 minuta","zasieg":"","czas_trwania":"24 godziny","skladnik":"kawałek świeżego owocu (+1)","opis":"Kapłan na pewien czas powstrzymuje proces gnicia zwłok. W trakcie trwania czaru poddane mumifikacji zwłoki nie mogą zostać ożywione za pomocą magii nekromanckiej.","page":171},{"name":"Męczeństwo","tradycja":"Magia kapłańska: Shallya","pm":14,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"1 minuta (6 rund)","skladnik":"kosmyk włosów postaci będącej celem czaru (+2)","opis":"Kapłan nawiązuje magiczną więź z dowolną postacią w odległości do 24 metrów. W trakcie trwania czaru wszystkie obrażenia zadawane tej postaci zostają przeniesione na kapłana.","page":173},{"name":"Młot Sigmara","tradycja":"Magia kapłańska: Sigmar","pm":5,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"1 minuta (6 rund)","skladnik":"amulet z wyrytym symbolem Sigmara (+1)","opis":"Kapłan napełnia potęgą Sigmara zwykły młot bojowy. W trakcie trwania czaru młot traktowany jest jako broń magiczna z cechą oręża «druzgoczący».","page":173},{"name":"Natchnienie","tradycja":"Tradycja Światła","pm":16,"czas_rzucania":"1 minuta","zasieg":"","czas_trwania":"","skladnik":"strona z książki (+2)","opis":"Świetlista moc natchnienia pozwala czarodziejowi rozwiązać jedną zagadkę lub problem: pomyślnie rzucony czar daje +30 do następnego testu wiedzy.","page":164},{"name":"Nawałnica","tradycja":"Tradycja Niebios","pm":25,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"","skladnik":"chorągiewka do ustalania kierunku i siły wiatru (+3)","opis":"Czarodziej przywołuje magiczną burzę z piorunami na obszarze w odległości do 48 metrów — może pojawić się nawet w zamkniętym pomieszczeniu lub pod ziemią. Wszystkie postacie w promieniu 5 metrów otrzymują trafienie o Sile 5.","page":160},{"name":"Niebiańskie skrzydła","tradycja":"Tradycja Niebios","pm":18,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"liczba minut równa wartości Magii czarodzieja","skladnik":"gołębie pióro (+2)","opis":"Czarodziej przywołuje moc niebios, która unosi go w powietrze — może latać z Szybkością 6. Można rzucić wyłącznie na siebie.","page":160},{"name":"Oblicze śmierci","tradycja":"Tradycja Nekromancji","pm":6,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"1 minuta (6 rund)","skladnik":"czaszka (+1)","opis":"Twarz nekromanty przybiera wygląd wyszczerzonej czaszki — symbolu śmierci. W trakcie trwania czaru wzbudza Strach (wg zwykłych zasad).","page":170},{"name":"Oczy prawdy","tradycja":"Tradycja Światła","pm":20,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"liczba rund równa wartości Magii czarodzieja","skladnik":"szklana kula (+2)","opis":"Oczy czarodzieja zyskują moc odróżniania świata rzeczywistego od ułudy: dostrzega niewidzialne obiekty i postacie, przenika wzrokiem iluzje i kamuflaż, zauważa ukryte istoty i sekretne przejścia oraz widzi w ciemnościach (zwykłych i magicznych).","page":164},{"name":"Oczyszczenie","tradycja":"Magia kapłańska: Shallya","pm":16,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"1 runda","skladnik":"płonąca pochodnia (+2)","opis":"Kapłan kieruje oczyszczającą moc Shallyi przeciwko dowolnemu demonowi lub wyznawcy Nurgla w odległości do 48 metrów. Ofiara natychmiast traci 1k10 punktów Żywotności (bez względu na Wytrzymałość i zbroję) i musi zdać test Siły Woli, inaczej zostaje ogłuszona na 1 rundę.","page":173},{"name":"Oddychanie pod wodą","tradycja":"Magia kapłańska: Manann","pm":7,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"1 godzina","skladnik":"żywa ryba (+1)","opis":"Dotyk kapłana sprawia, że dowolna postać może oddychać pod wodą. Czar dotykowy — kapłan może go rzucić również na siebie.","page":171},{"name":"Odesłanie demona","tradycja":"Tradycja Światła","pm":13,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"","skladnik":"dębowa różdżka (+2)","opis":"Czarodziej spowija oślepiającymi strumieniami Hysh dowolnego demona w odległości do 24 metrów i odsyła go do Domeny Chaosu (przeciwstawny test Siły Woli). Może też posłużyć do uzdrowienia postaci opętanej przez demona.","page":164},{"name":"Ogień U'zhul","tradycja":"Tradycja Ognia","pm":6,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"zapałka (+1)","opis":"Czarodziej ciska ognistym pociskiem w przeciwnika w odległości do 36 metrów. Magiczny pocisk o Sile 4.","page":161},{"name":"Ognista korona","tradycja":"Tradycja Ognia","pm":8,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"liczba minut równa wartości Magii czarodzieja","skladnik":"złota moneta (+1)","opis":"Nad głową pojawia się korona z płomieni: +20 do testów dowodzenia i zastraszania. Każdy przeciwnik w walce wręcz musi zdać test Siły Woli albo nie może zaatakować. Daje światło jak pochodnia; czarodziej nie odnosi obrażeń.","page":161},{"name":"Ognista kula","tradycja":"Tradycja Ognia","pm":12,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"brylka siarki (+2)","opis":"Czarodziej tworzy tyle ognistych kul, ile wynosi jego Magia, i ciska nimi w jednego lub kilku przeciwników w promieniu 48 metrów. Magiczne pociski o Sile 3.","page":161},{"name":"Ognisty dech","tradycja":"Tradycja Ognia","pm":25,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"","skladnik":"łuska smoka (+3)","opis":"Czarodziej zieje ogniem niczym smok — stożek szeroki od 1 metra przy nim do 5 metrów na końcu, długi do 16 metrów. Ogarnięte postacie otrzymują trafienie o Sile 8; udany test Siły Woli redukuje je do Siły 4.","page":161},{"name":"Ognisty podmuch","tradycja":"Tradycja Ognia","pm":22,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"","skladnik":"sztylet z potrójnie hartowanej stali (+3)","opis":"Czarodziej posyła 1k10 ognistych podmuchów w jednego lub kilku przeciwników w odległości do 48 metrów. Magiczne pociski o Sile 4; liczba podmuchów nie może być mniejsza od wartości Magii.","page":161},{"name":"Oplątanie","tradycja":"Magia kapłańska: Taal i Rhya","pm":8,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"1 minuta (6 rund)","skladnik":"winorośl (+1)","opis":"Kapłan przyzywa moc drzemiącą w roślinach — w dowolnym miejscu do 48 metrów z ziemi wyrastają pnącza. Postacie w promieniu 5 metrów wykonują test Krzepy: nieudany = unieruchomione, udany = poruszają się z połową Szybkości. Każdy, kto wejdzie w obszar, podlega działaniu zaklęcia.","page":174},{"name":"Ostatnie słowa","tradycja":"Tradycja Śmierci","pm":18,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"","skladnik":"skrawek papieru welinowego (+2)","opis":"Czarodziej może zadać jedno pytanie duszy odchodzącej w zaświaty — postaci zabitej w odległości do 12 metrów. Musi rzucić czar w ciągu 1 minuty (6 rund) od śmierci. Dusza nie musi odpowiadać zgodnie z prawdą ani w ogóle. Nie działa na istoty pozbawione duszy.","page":162},{"name":"Oszołomienie","tradycja":"Tradycja Cienia","pm":8,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"liczba rund równa wartości Magii czarodzieja","skladnik":"trochę piwa (+1)","opis":"Czarodziej ogłupia dowolną postać w odległości do 24 metrów (ofiara broni się testem Siły Woli). Efekt wg rzutu procentowego: 01-20 otępienie (1 akcja/rundę), 21-40 ucieczka w losowym kierunku, 41-60 atak najbliższej postaci, 61-80 paraliż, 81-00 lęk (bezbronna).","page":157},{"name":"Otwarcie","tradycja":"Magia kapłańska: Ranald","pm":9,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"1 minuta (6 rund)","skladnik":"klucz (+1)","opis":"Kapłan magicznie otwiera dowolny zamek, rygiel lub skobel w odległości do 2 metrów; w trakcie trwania czaru nikt oprócz kapłana nie może go zamknąć. Udany test splatania magii pozwala przełamać zaklęcie magiczne zamknięcie.","page":173},{"name":"Ożywienie","tradycja":"Tradycja Nekromancji","pm":8,"czas_rzucania":"jedna akcja za każde ożywione zwłoki","zasieg":"","czas_trwania":"","skladnik":"pył z mogiły (+1)","opis":"Nekromanta ożywia zwłoki, tworząc zombi lub szkielety w liczbie równej wartości Magii. Musi znajdować się nie dalej niż 12 metrów od świeżych zwłok (zombi) lub kości (szkielety).","page":170},{"name":"Ożywienie umarłych","tradycja":"Tradycja Nekromancji","pm":22,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"","skladnik":"pył z mumii (+3)","opis":"Działa jak ożywienie, z tą różnicą, że nekromanta ożywia 2k10 szkieletów lub zombi z dowolnych zwłok znajdujących się w odległości do 24 metrów.","page":170},{"name":"Pancerz Eteru","tradycja":"Magia powszechna","pm":5,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"1 minuta (6 rund)","skladnik":"ogniwo kolczugi (+1)","opis":"Adept splata wokół siebie Wiatry Magii, tworząc niewidzialną barierę. Zapewnia dodatkowe Punkty Zbroi na każdej lokacji równe wartości jego Magii. Nie działa, jeśli adept nosi zbroję; przerywa się po założeniu zbroi lub wzięciu tarczy.","page":155},{"name":"Pancerz prawości","tradycja":"Magia kapłańska: Sigmar","pm":6,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"liczba minut równa wartości Magii kapłana","skladnik":"żelazny pierścień (+1)","opis":"Kapłan otacza się ochronną aurą mocy: otrzymuje +1 Punkt Zbroi na wszystkich lokacjach ciała (wciąż obowiązuje ograniczenie do 5 PZ na każdej lokacji).","page":173},{"name":"Pancerz z ołowiu","tradycja":"Tradycja Metalu","pm":14,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"1 minuta (6 rund)","skladnik":"miniaturowy hełm z ołowiu (+2)","opis":"Zbroje grupy przeciwników w odległości do 48 metrów stają się ciężkie jak z ołowiu. Wszystkie odziane w pancerz postacie w promieniu 5 metrów: -10 do Walki Wręcz, Umiejętności Strzeleckich i Zręczności oraz -1 do Szybkości.","page":159},{"name":"Pałąca krew","tradycja":"Tradycja Chaosu","pm":13,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"fiolka wypełniona krwią demona (+3)","opis":"Czarnoksiężnik pluje krwią, która pali niczym kwas. To magiczny pocisk o Sile 4; wybrana postać w odległości do 24 metrów otrzymuje tyle trafień, ile wynosi Magia czarnoksiężnika.","page":169},{"name":"Pierwsze proroctwo Amul","tradycja":"Tradycja Niebios","pm":6,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"1 runda","skladnik":"odłamek szkła (+1)","opis":"Czarodziej przepowiada najbliższą przyszłość. W swojej następnej turze gracz może przerzucić wynik jednej kostki (test umiejętności lub cechy, rzut na obrażenia, ustalenie poziomu mocy itp.).","page":159},{"name":"Podmuch wiatru","tradycja":"Tradycja Niebios","pm":14,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"liczba rund równa wartości Magii czarodzieja","skladnik":"zwierzęcy pęcherz (+2)","opis":"Czarodziej przyzywa gwałtowny wicher na obszarze do 48 metrów. Postacie w promieniu 5 metrów wokół wskazanego miejsca przewracają się i muszą zdać test Odporności (nieudany = ogłuszone na 1 rundę). Objęte działaniem nie mogą używać broni strzeleckiej ani być jej celem; poruszanie się wymaga testu Krzepy, a ataki wręcz mają -20.","page":160},{"name":"Podniebny chód","tradycja":"Magia powszechna","pm":11,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"1 runda","skladnik":"orle pióro (+2)","opis":"Czar pozwala przez krótką chwilę chodzić w powietrzu jak po stałym gruncie. Adept może przebyć odległość równą wartości Szybkości, a potem powoli opada. Maksymalna wysokość wynosi 6 metrów.","page":156},{"name":"Podsłuchiwanie","tradycja":"Magia kapłańska: Verena","pm":15,"czas_rzucania":"1 minuta","zasieg":"","czas_trwania":"liczba minut równa wartości Magii kapłana","skladnik":"tuba przyłożona do ucha (+2)","opis":"Dzięki mocy Vereny kapłan słyszy wszystko, co dzieje się w dowolnie wybranym miejscu w zasięgu jego wzroku — tak wyraźnie, jakby stał w tym miejscu.","page":176},{"name":"Pokusa Chaosu","tradycja":"Tradycja Chaosu","pm":16,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"1 runda","skladnik":"zbezczeszczony święty symbol (+2)","opis":"Czarnoksiężnik roztacza wizję Chaosu oczarowującą dowolną postać w odległości do 24 metrów. Ofiara broni się testem Siły Woli; nieudany = w następnej turze wykonuje polecenia czarnoksiężnika. Nie działa na ożywieńców.","page":169},{"name":"Poskromienie","tradycja":"Tradycja Zwierząt","pm":5,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"liczba godzin równa wartości Magii (przerywa się, gdy czarodziej zaatakuje zwierzę)","skladnik":"grudka cukru (+1)","opis":"Łagodny, hipnotyzujący głos czarodzieja uspokaja dowolne zwierzę w odległości do 48 metrów. Zwierzę broni się testem Siły Woli; nieudany = czarodziej może bez obaw podejść i dotknąć go, a przy wierzchowcu otrzymuje +10 do testów jeździectwa na tym zwierzęciu.","page":164},{"name":"Posłaniec ze snu","tradycja":"Magia kapłańska: Morr","pm":10,"czas_rzucania":"1 minuta","zasieg":"","czas_trwania":"30 sekund (3 rundy)","skladnik":"kłębek wełny (+1)","opis":"Kapłan objawia się we śnie wybranej postaci i przez 30 sekund może przekazać jej dowolną wiadomość. Odbiorca musi być osobą, którą kapłan spotkał osobiście, musi rozumieć język kapłana i musi spać w momencie rzucenia zaklęcia.","page":171},{"name":"Pożoga zagłady","tradycja":"Tradycja Ognia","pm":31,"czas_rzucania":"3 akcje","zasieg":"","czas_trwania":"do śmierci wszystkich istot w polu działania","skladnik":"ząb smoka (+3)","opis":"Najbardziej niszczycielski czar piromancji. Obszar do 48 metrów zamienia się w ogniste piekło; wszyscy w promieniu 5 metrów otrzymują tyle trafień o Sile 4, ile wynosi Magia czarodzieja, i co rundę wykonują test Siły Woli. Tak potężny, że wyczuwają go czarodzieje w promieniu 5 kilometrów.","page":162},{"name":"Prawdomówność","tradycja":"Magia kapłańska: Verena","pm":13,"czas_rzucania":"2 akcje podwójne","zasieg":"","czas_trwania":"","skladnik":"zwierciadło (+2)","opis":"Kapłan zadaje jedno pytanie wybranej postaci, która rozumie jego język. Postać broni się testem Siły Woli; nieudany = musi odpowiedzieć zgodnie z prawdą (wedle swojej wiedzy i przekonań). Wobec BN MG wykonuje test w tajemnicy. Kolejne pytanie musi znacząco różnić się od poprzedniego.","page":176},{"name":"Prawo logiki","tradycja":"Tradycja Metalu","pm":7,"czas_rzucania":"1k10 akcji podwójnych","zasieg":"","czas_trwania":"5 minut lub do wykonania wybranego testu","skladnik":"czysta karta papieru (+1)","opis":"Czarodziej czerpie moc, by znaleźć logiczne rozwiązanie pojedynczego problemu lub zagadki. On lub towarzysz w odległości do 12 metrów otrzymuje +20 do dowolnego testu umiejętności lub cechy. Losowy czas rzucania odpowiada rozważaniom nad naturą problemu.","page":158},{"name":"Przebudzenie upiora","tradycja":"Tradycja Nekromancji","pm":24,"czas_rzucania":"2 akcje podwójne","zasieg":"","czas_trwania":"","skladnik":"korona z żelaza hartowanego w ludzkiej krwi (+3)","opis":"Działa jak ożywienie, z tą różnicą, że nekromanta ożywia upiora. Wykorzystane zwłoki muszą należeć do postaci, która za życia wykonywała profesję zaawansowaną.","page":170},{"name":"Przekształcenie metalu","tradycja":"Tradycja Metalu","pm":18,"czas_rzucania":"1 minuta","zasieg":"","czas_trwania":"","skladnik":"talizman w kształcie młota i kowadła (+2)","opis":"Czarodziej przemienia dowolny metalowy przedmiot w inny (nie może zmienić rodzaju metalu). Jakość wg testu splatania magii: Bardzo Trudny (-30) najlepsza, Trudny (-20) dobra, bez modyfikatora zwykła, nieudany kiepska. Czar dotykowy; nie działa na przedmioty magiczne.","page":159},{"name":"Przemiana w kruka","tradycja":"Tradycja Zwierząt","pm":7,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"1 godzina (można przerwać; kończy się przy trafieniu krytycznym)","skladnik":"krucze pióro (+1)","opis":"Czarodziej (wraz z podręcznym ekwipunkiem) zamienia się w kruka. Zachowuje zdolności umysłowe, Inteligencję i Siłę Woli; pozostałe cechy jak u zwykłego kruka. W tej postaci nie może mówić ani rzucać czarów.","page":164},{"name":"Przemiana w niedźwiedzia","tradycja":"Tradycja Zwierząt","pm":21,"czas_rzucania":"3 akcje podwójne","zasieg":"","czas_trwania":"","skladnik":"pazur niedźwiedzia (+3)","opis":"Działa jak przemiana w kruka, z tą różnicą, że czarodziej zamienia się w niedźwiedzia (opis i współczynniki w Rozdziale XI: Bestiariusz).","page":165},{"name":"Przemiana w wilka","tradycja":"Tradycja Zwierząt","pm":15,"czas_rzucania":"2 akcje podwójne","zasieg":"","czas_trwania":"","skladnik":"wilcza łapa (+2)","opis":"Działa jak przemiana w kruka, z tą różnicą, że czarodziej zamienia się w wilka (opis i współczynniki w Rozdziale XI: Bestiariusz).","page":165},{"name":"Przerażający wygląd","tradycja":"Tradycja Cienia","pm":21,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"1 minuta (6 rund)","skladnik":"skrawek szaty upiora (+3)","opis":"Czarodziej przybiera wygląd przerażającej istoty i wzbudza Grozę (wg zasad z Rozdziału IX: Mistrz Gry).","page":158},{"name":"Przyjaciel zwierząt","tradycja":"Magia kapłańska: Taal i Rhya","pm":4,"czas_rzucania":"3 akcje","zasieg":"","czas_trwania":"10 minut","skladnik":"język zwierzęcia (+1)","opis":"Dzięki pomocy Taala kapłan może porozumiewać się z dowolnym zwierzęciem w odległości do 12 metrów; otrzymuje też +20 do testów oswajania tego zwierzęcia. Zwierzę odpowiada zgodnie ze swoją (nieabstrakcyjną) naturą — treść ustala MG.","page":174},{"name":"Przypalenie","tradycja":"Tradycja Ognia","pm":4,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"kawałek węgla drzewnego (+1)","opis":"Czarodziej kładzie dłonie na otwartej ranie i wypala ją dotykiem. Nie przywraca Żywotności, ale liczy się jako pomoc medyczna, która może ocalić od śmierci ciężko ranną postać. Bywa używany też np. do napiętnowania.","page":161},{"name":"Przyzwanie ducha","tradycja":"Tradycja Nekromancji","pm":17,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"24 godziny","skladnik":"kawałek drewna ze zbezczeszczonej trumny (+2)","opis":"Nekromanta przyzywa i zmusza do posłuszeństwa dowolnego ducha, widmo lub zjawę w odległości do 24 metrów. Ożywieniec wykonuje test Siły Woli; nieudany = w trakcie trwania czaru pozostaje posłuszny rozkazom nekromanty.","page":170},{"name":"Przyzwanie grupy demonów","tradycja":"Tradycja Chaosu","pm":25,"czas_rzucania":"2 akcje podwójne","zasieg":"","czas_trwania":"1k10 minut","skladnik":"wciąż bijące serca sześciu humanoidów (+3)","opis":"Działa jak przyzwanie pomniejszego demona, lecz czarnoksiężnik przyzywa kilka pomniejszych demonów (tyle, ile wynosi jego Magia). Pojawiają się w dowolnym miejscu do 12 metrów.","page":169},{"name":"Przyzwanie pomniejszego demona","tradycja":"Tradycja Chaosu","pm":12,"czas_rzucania":"2 akcje podwójne","zasieg":"","czas_trwania":"1k10 minut","skladnik":"wciąż bijące serce istoty humanoidalnej (+2)","opis":"Czarnoksiężnik przyzywa pomniejszego demona (opis i współczynniki w Rozdziale XI: Bestiariusz), który pojawia się w dowolnym miejscu do 12 metrów. Udany test Siły Woli daje czarnoksiężnikowi kontrolę nad poczynaniami demona.","page":168},{"name":"Próba ognia","tradycja":"Magia kapłańska: Verena","pm":18,"czas_rzucania":"1 minuta","zasieg":"","czas_trwania":"liczba rund równa wartości Magii kapłana","skladnik":"opal ognisty o wartości min. 50 zk (+2)","opis":"Kapłan poddaje ostatecznej próbie dowolną postać do 12 metrów: wypowiada oskarżenie, a przyzwana moc ogarnia ją płomieniem. Jeśli postać jest niewinna, po jednej rundzie płomienie gasną bez szkody; jeśli winna — co rundę otrzymuje trafienie o Sile 8 (ogień). Potężny czar używany tylko wobec największych zbrodniarzy.","page":176},{"name":"Płaszcz cieni","tradycja":"Tradycja Cienia","pm":5,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"liczba minut równa wartości Magii czarodzieja","skladnik":"kawałek węgla drzewnego (+1)","opis":"Czarodziej przywołuje moc Ulgu, okrywając ciało zasłoną utkaną z cieni: +20 do testów ukrywania się.","page":157},{"name":"Płomień wiary","tradycja":"Magia kapłańska: Sigmar","pm":20,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"złoty amulet z wizerunkiem komety o dwóch ogonach (+2)","opis":"Kapłan przyzywa gniew Sigmara, otaczając się płomieniami, które go nie ranią. Wszystkie postacie w promieniu 10 metrów otrzymują trafienie o Sile 3; demony i ożywieńcy w zasięgu płomieni — o Sile 5. Od tych obrażeń nie odejmuje się Punktów Zbroi.","page":174},{"name":"Rozbłysk","tradycja":"Tradycja Światła","pm":5,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"1k10 rund","skladnik":"niewielkie zwierciadło (+1)","opis":"Czarodziej wywołuje rozbłysk światła w dowolnym miejscu w odległości do 36 metrów. Wszystkie postacie w promieniu 3 metrów otrzymują -10 do Walki Wręcz, Umiejętności Strzeleckich, Zręczności i wszystkich testów związanych ze wzrokiem.","page":163},{"name":"Rozproszenie magii","tradycja":"Magia powszechna","pm":13,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"","skladnik":"srebrny młoteczek (+2)","opis":"Umożliwia rozproszenie efektu dowolnego zaklęcia działającego na obszarze w odległości do 12 metrów (nie działa na magię rytualną). Rzucający otrzymuje modyfikator -10 do testu splatania magii za każdy punkt Magii postaci, która rzuciła rozpraszany czar. Nie działa na ożywieńców i demony.","page":156},{"name":"Rączy jeleń","tradycja":"Magia kapłańska: Taal i Rhya","pm":6,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"liczba minut równa wartości Magii kapłana","skladnik":"kłębek sierści jelenia (+1)","opis":"Kapłan czuje w sobie moc dzikiego jelenia: otrzymuje +1 do Szybkości i może wykonywać «szarżę» w ramach akcji zwykłej, a nie podwójnej.","page":174},{"name":"Siła natury","tradycja":"Tradycja Życia","pm":27,"czas_rzucania":"10 minut","zasieg":"","czas_trwania":"do końca trwającej pory roku","skladnik":"fiolka wypełniona wodą z poświęconej sadzawki (+3)","opis":"Magia natury oczyszcza z zarazy obszar o powierzchni jednego kilometra kwadratowego: wszystkie rośliny zostają magicznie wyleczone, a obszar jest chroniony przed efektami plagi. Może też wyleczyć 2k10 postaci dotkniętych chorobą.","page":167},{"name":"Siła niedźwiedzia","tradycja":"Magia kapłańska: Taal i Rhya","pm":15,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"1 minuta (6 rund)","skladnik":"niedźwiedzi pazur (+2)","opis":"Moc Taala przepływa przez kapłana, który może obdarzyć dowolną postać siłą niedźwiedzia górskiego: +20 do Krzepy (czyli także +2 do Siły). Czar dotykowy, można na siebie.","page":175},{"name":"Siła umysłu","tradycja":"Tradycja Metalu","pm":23,"czas_rzucania":"10 minut","zasieg":"","czas_trwania":"","skladnik":"strona z księgi napisanej przez szaleńca (+3)","opis":"Czarodziej mocą umysłu próbuje uzdrowić obłąkaną postać — magia jest nieprzewidywalna. Udany test splatania magii usuwa 1k10 Punktów Obłędu, nieudany dodaje kolejne 1k10. Czar dotykowy; nie na siebie ani na zwierzęta.","page":159},{"name":"Skrzydła sokoła","tradycja":"Tradycja Zwierząt","pm":25,"czas_rzucania":"2 akcje podwójne","zasieg":"","czas_trwania":"liczba minut równa wartości Magii czarodzieja","skladnik":"żywy sokół (+3)","opis":"Z pleców czarodzieja wyrastają skrzydła na tyle mocne, by unieść go w powietrze — lata z Szybkością 4.","page":165},{"name":"Sobowtór","tradycja":"Tradycja Cienia","pm":7,"czas_rzucania":"3 akcje","zasieg":"","czas_trwania":"","skladnik":"pukiel włosów przedstawiciela rasy, w którą ma się przeobrazić czarodziej (+1)","opis":"Czarodziej przybiera wygląd (wraz z ubraniem i zbroją) dowolnej żywej istoty humanoidalnej poniżej 3 metrów wzrostu. Zmienia tylko wygląd zewnętrzny — nie wiedzę ani barwę głosu. Kto go podejrzewa, może wykonać test Inteligencji; by przybrać wygląd konkretnej osoby, potrzebny jest udany test splatania magii.","page":157},{"name":"Spryt Ranalda","tradycja":"Magia kapłańska: Ranald","pm":5,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"liczba minut równa wartości Magii kapłana","skladnik":"kocia skórka (+1)","opis":"Ranald obdarza kapłana niesamowitą zręcznością: +20 do testów ukrywania się i skradania się. Mijając miejsce z magicznym alarmem, kapłan może wykonać test splatania magii, by przemknąć niepostrzeżenie.","page":172},{"name":"Srebrzyste strzały Arha","tradycja":"Tradycja Metalu","pm":13,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"srebrny grot strzały (+2)","opis":"Czarodziej tworzy kilka magicznych strzał z czystego srebra (tyle, ile wynosi jego Magia) i ciska nimi w jednego lub kilku przeciwników w odległości do 48 metrów. Magiczne pociski o Sile 3; po uderzeniu niemal natychmiast znikają.","page":158},{"name":"Strefa mroku","tradycja":"Tradycja Cienia","pm":15,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"liczba rund równa wartości Magii czarodzieja","skladnik":"oczy salamandry (+2)","opis":"Czarodziej tworzy obszar nieprzeniknionej ciemności w odległości do 48 metrów. W promieniu 5 metrów nikt nie widzi (chyba że ma widzenie w ciemności); postacie muszą na początku tury zdać test Siły Woli, inaczej wykonają tylko jedną akcję zwykłą.","page":157},{"name":"Szept rzeki","tradycja":"Tradycja Życia","pm":15,"czas_rzucania":"1 minuta","zasieg":"","czas_trwania":"liczba rund równa wartości Magii czarodzieja","skladnik":"flaszka wina (+2)","opis":"Czarodziej zanurza się w rzece lub strumieniu i łączy z wodą, komunikując się z duchem rzeki. Może dowiedzieć się, co zdarzyło się w jej odmętach do 1 kilometra w górę i w dół biegu, w ciągu ostatnich 24 godzin. Duchy przekazują tylko fakty ogólne.","page":166},{"name":"Szpony furii","tradycja":"Tradycja Zwierząt","pm":8,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"liczba minut równa wartości Magii czarodzieja","skladnik":"koci pazur (+1)","opis":"Paznokcie czarodzieja zamieniają się w ostre pazury: +1 do Ataków i +10 do Walki Wręcz, traktowane jak broń jednoręczna z cechą oręża «szybki». W trakcie trwania nie może trzymać w rękach innej broni.","page":165},{"name":"Sztylety cienia","tradycja":"Tradycja Cienia","pm":21,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"nóż ze skuwanego na zimno żelaza (+3)","opis":"Czarodziej czerpie moc cienia i tworzy z niej kilka sztyletów (tyle, ile wynosi jego Magia), którymi ciska w jednego lub kilku przeciwników w odległości do 48 metrów. To magiczne pociski.","page":158},{"name":"Słowo bólu","tradycja":"Tradycja Chaosu","pm":27,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"krew demona (+3)","opis":"Czarnoksiężnik głośno wypowiada jedno z tajemnych imion Mrocznych Potęg Chaosu, sprowadzając na ofiarę potworny ból (pełny opis: Księga Zasad, str. 169).","page":169},{"name":"Tarcza Aqshy","tradycja":"Tradycja Ognia","pm":12,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"1k10 minut","skladnik":"żelazny amulet (+2)","opis":"Czarodziej otacza się wirami czerwonego Wiatru Magii chroniącymi przed płomieniami: +20 do Odporności przeciw ognistym atakom (zionięcie smoka, ogniste kule itp.). Można rzucić wyłącznie na siebie.","page":161},{"name":"Tarcza Myrmidii","tradycja":"Magia kapłańska: Myrmidia","pm":20,"czas_rzucania":"3 akcje","zasieg":"","czas_trwania":"1 minuta (6 rund)","skladnik":"tarcza (+2)","opis":"Wszyscy sprzymierzeńcy w promieniu 24 metrów otrzymują +1 Punkt Zbroi na wszystkich lokacjach ciała (wciąż obowiązuje ograniczenie do 5 PZ na każdej lokacji).","page":172},{"name":"Tłumienie magii","tradycja":"Tradycja Metalu","pm":26,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"1k10 rund","skladnik":"niewielka ozdobna pochwa ze złota o wartości min. 75 zk (+3)","opis":"Czarodziej przywołuje moc Chamon, owijając jej pasmami dowolny magiczny przedmiot w odległości do 24 metrów. W trakcie trwania czaru przedmiot traci wszystkie swoje właściwości magiczne.","page":159},{"name":"Uciszenie","tradycja":"Magia powszechna","pm":10,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"liczba rund równa wartości Magii adepta","skladnik":"knebel (+1)","opis":"Adept tworzy wokół dowolnej postaci w odległości do 24 metrów zamkniętą sferę ciszy. Ofiara może oprzeć się czarowi udanym testem Siły Woli; w trakcie trwania nie wydaje żadnych dźwięków.","page":156},{"name":"Uczta kruków","tradycja":"Tradycja Zwierząt","pm":17,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"","skladnik":"żywy kruk (+2)","opis":"Czarodziej przywołuje chmarę morderczych, nadnaturalnych kruków w dowolnym miejscu do 48 metrów; natychmiast atakują wskazane postacie. Wszystkie postacie w promieniu 5 metrów otrzymują 1 trafienie o Sile 3 — ciosy zawsze w głowę. Chwilę później chmara się rozprasza.","page":165},{"name":"Ukojenie Rhyi","tradycja":"Magia kapłańska: Taal i Rhya","pm":18,"czas_rzucania":"1 minuta","zasieg":"","czas_trwania":"","skladnik":"kubek świeżego mleka (+1)","opis":"Kapłan błaga Matkę Ziemię o pomoc. Wszyscy towarzysze w odległości do 10 metrów czują się odświeżeni i wypoczęci, jakby odpoczywali przez trzy dni — odzyskują punkty Żywotności zgodnie ze zwykłymi zasadami odpoczynku.","page":175},{"name":"Umagicznienie","tradycja":"Tradycja Metalu","pm":21,"czas_rzucania":"1 minuta","zasieg":"","czas_trwania":"1 godzina","skladnik":"pióro gryfa (+3)","opis":"Czarodziej zamyka odrobinę magicznej energii w przedmiocie: +5 do dowolnej cechy związanej z jego podstawową funkcją (np. magiczny miecz zwiększa WW, pierścień daje modyfikator do Ogłady). Naraz działa tylko jedno umagicznienie. Czar dotykowy.","page":159},{"name":"Upływ lat","tradycja":"Tradycja Śmierci","pm":11,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"niewielka klepsydra (+2)","opis":"Czarodziej sprawia, że jeden niemagiczny przedmiot (Obciążenie 75 lub mniejsze) błyskawicznie starzeje się i niszczeje. Przedmioty kiepskiej i zwykłej jakości rozpadają się w pył; dobrej jakości stają się kiepskie; najlepszej — zwykłe.","page":162},{"name":"Urok","tradycja":"Magia kapłańska: Ranald","pm":14,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"1 runda","skladnik":"kłębek wełny (+1)","opis":"Kapłan zmusza do posłuszeństwa dowolną istotę humanoidalną (człowieka, elfa, orka, zwierzoczłeka itp.) w odległości do 24 metrów. Ofiara broni się testem Siły Woli; nieudany = w następnej rundzie jej poczynaniami kieruje kapłan. Nie działa na demony i ożywieńców.","page":173},{"name":"Uzdrowienie","tradycja":"Tradycja Światła","pm":10,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"przezroczysty szklany paciorek (+2)","opis":"Dotyk czarodzieja uzdrawia ranną postać, przywracając tyle punktów Żywotności, ile wynosi wartość Magii czarodzieja. Czar dotykowy — można rzucić również na siebie.","page":163},{"name":"Uśmiech losu","tradycja":"Magia kapłańska: Ranald","pm":20,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"","skladnik":"posrebrzane kości do wróżenia (+2)","opis":"Działa podobnie jak Ślepy traf, z tą różnicą, że obejmuje działaniem kapłana i wszystkich jego towarzyszy w odległości do 24 metrów.","page":173},{"name":"Waleczność","tradycja":"Magia kapłańska: Myrmidia","pm":10,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"liczba rund równa wartości Magii kapłana","skladnik":"wiązka patyków (+1)","opis":"Kapłan modli się do Myrmidii, by natchnęła jego sprzymierzeńców maestrią bojową. Wszyscy towarzysze w promieniu 24 metrów otrzymują +10 do Walki Wręcz.","page":172},{"name":"Welon zepsucia","tradycja":"Tradycja Chaosu","pm":24,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"do udanego testu Siły Woli każdej objętej postaci","skladnik":"miecz wojownika Chaosu (+3)","opis":"Czarnoksiężnik przyzywa mroczną chmurę zepsucia w dowolnym miejscu do 36 metrów. Postacie w promieniu 5 metrów wykonują test Siły Woli; nieudany = tracą 1 punkt Żywotności (bez względu na Wytrzymałość i zbroję), a rany gniją (co turę tracą punkt do udanego testu). Kto straci 2+ punkty, wykonuje test Odporności — nieudany oznacza mutację Chaosu (Tabela 11-1).","page":169},{"name":"Wicher śmierci","tradycja":"Tradycja Śmierci","pm":27,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"","skladnik":"ametyst o wartości min. 50 zk (+3)","opis":"Czarodziej przyzywa zabójczy wicher czystej energii Shyish na obszarze do 48 metrów. Wszystkie postacie w promieniu 5 metrów natychmiast tracą 1k10 punktów Żywotności, bez względu na Wytrzymałość i noszoną zbroję.","page":163},{"name":"Wieczny odpoczynek","tradycja":"Magia kapłańska: Morr","pm":13,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"drewniany kołek (+2)","opis":"Kapłan modli się do boga, by uspokoił ożywionego trupa. Dotyk kapłana zadaje ożywieńcowi trafienie o Sile 8. Jest to czar dotykowy.","page":171},{"name":"Wilcze serce","tradycja":"Magia kapłańska: Ulryk","pm":15,"czas_rzucania":"3 akcje","zasieg":"","czas_trwania":"1 minuta (6 rund)","skladnik":"serce wilka (+2)","opis":"Kapłan wzywa moc Ulryka, która napełnia bitewnym duchem jego towarzyszy. W trakcie trwania czaru są odporni na Strach i Grozę oraz na efekty umiejętności zastraszanie i zdolności niepokojący.","page":175},{"name":"Wilczy zew","tradycja":"Magia kapłańska: Ulryk","pm":11,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"1 runda","skladnik":"język wilka (+2)","opis":"Kapłan wyje niczym jeden z wilków Ulryka, wzbudzając w towarzyszach żądzę mordu. Wszyscy towarzysze w promieniu 24 metrów mogą atakować dwukrotnie w czasie «szarży», niezależnie od posiadanej liczby Ataków.","page":175},{"name":"Wiosenny rozkwit","tradycja":"Tradycja Życia","pm":18,"czas_rzucania":"10 minut","zasieg":"","czas_trwania":"","skladnik":"garść nawozu (+2)","opis":"Czarodziej wzbudza życiodajną moc w dowolnej istocie (bez względu na rasę) lub na obszarze wielkości pola uprawnego, zwiększając płodność. Ziemia wyda obfite plony, a żywa istota w ciągu miesiąca zajdzie w ciążę (po zaistnieniu pozostałych warunków).","page":166},{"name":"Witalność","tradycja":"Tradycja Nekromancji","pm":11,"czas_rzucania":"3 akcje","zasieg":"","czas_trwania":"","skladnik":"kły nietoperza wampira (+1)","opis":"Nekromanta pije krew trupa (zmarłego najwyżej godzinę wcześniej) i leczy w ten sposób swoje rany — przywraca sobie 1k10 punktów Żywotności.","page":170},{"name":"Wizja Morra","tradycja":"Magia kapłańska: Morr","pm":15,"czas_rzucania":"1 minuta","zasieg":"","czas_trwania":"","skladnik":"grzyb zebrany z mogiły (+2)","opis":"Kapłan modli się do Morra o objawienie wyjaśniające zaistniały problem lub zagadkę. MG w tajemnicy wykonuje test Ogłady BG; udany = wizja zawiera pomocne wskazówki, nieudany = wizja nie przybliża do rozwiązania.","page":172},{"name":"Wizja męki","tradycja":"Tradycja Chaosu","pm":7,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"1 runda","skladnik":"niewielka maska (+1)","opis":"Czarnoksiężnik sprawia, że dowolną postać w odległości do 24 metrów nawiedzają piekielne wizje. Ofiara wykonuje test Siły Woli; nieudany = zostaje ogłuszona, a gdy otrząśnie się z szoku, wykonuje kolejny test Siły Woli — nieudany oznacza 1 Punkt Obłędu.","page":168},{"name":"Wizja przeszłości","tradycja":"Magia kapłańska: Verena","pm":8,"czas_rzucania":"1 minuta","zasieg":"","czas_trwania":"","skladnik":"oczy sowy (+1)","opis":"Kapłan koncentruje się i dotyka przedmiotu, poznając jego historię — może dowiedzieć się o trzech najważniejszych zdarzeniach z jego dziejów (ustala MG): kto go wykonał, najważniejsi właściciele lub znaczące wydarzenia. Ponowne rzucenie na ten sam przedmiot nie przynosi efektu.","page":175},{"name":"Wizja śmierci","tradycja":"Tradycja Śmierci","pm":5,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"1 godzina","skladnik":"garść ziemi zebranej z mogiły (+1)","opis":"Czarodziej widzi duchy i zjawy, normalnie niewidoczne dla zwykłych ludzi. Obserwując śmierć żywej istoty, może dostrzec duszę opuszczającą martwe ciało.","page":162},{"name":"Wrota ziemi","tradycja":"Tradycja Życia","pm":14,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"","skladnik":"żelazny klucz (+2)","opis":"Czarodziej zapada się pod ziemię i pojawia w dowolnym miejscu w odległości do 48 metrów. Zarówno miejsce zniknięcia, jak i pojawienia muszą leżeć na obszarze pokrytym ziemią — nie zadziała wewnątrz budynku ani na wybrukowanej ulicy.","page":166},{"name":"Wróżba","tradycja":"Tradycja Niebios","pm":4,"czas_rzucania":"1 minuta","zasieg":"","czas_trwania":"2k10 godzin","skladnik":"wątroba małego zwierzęcia (+1)","opis":"Czarodziej wróży z gwiazd, przepowiadając najbliższą przyszłość. Może określić, czy dana czynność się powiedzie — MG w tajemnicy wykonuje test Inteligencji BG; udany oznacza trafną przepowiednię, nieudany błędną (choć BG o tym nie wie). Dopóki czar trwa, przepowiednia jest prawdziwa.","page":159},{"name":"Wykrycie pułapek","tradycja":"Magia kapłańska: Ranald","pm":16,"czas_rzucania":"2 akcje podwójne","zasieg":"","czas_trwania":"","skladnik":"oczy sokoła (+2)","opis":"Kapłan magicznie sonduje okolicę i automatycznie wykrywa wszystkie pułapki w promieniu 12 metrów. Zaklęcie nie rozbraja pułapek, jedynie informuje o ich istnieniu i położeniu.","page":173},{"name":"Wyssanie życia","tradycja":"Tradycja Śmierci","pm":16,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"fiolka wypełniona krwią (+2)","opis":"Czarodziej sięga strumieniem mocy w stronę przeciwnika do 12 metrów i wysysa jego życiową energię, lecząc własne ciało. Ofiara broni się testem Siły Woli; nieudany = traci 1k10 Żywotności (bez względu na Wytrzymałość i zbroję), a odjęte punkty leczą czarodzieja (nie ponad maksimum). Nie działa na ożywieńców i demony.","page":162},{"name":"Włócznia Myrmidii","tradycja":"Magia kapłańska: Myrmidia","pm":5,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"1 minuta (6 rund)","skladnik":"osełka (+1)","opis":"Włócznia trzymana przez kapłana zostaje napełniona mocą Myrmidii i jest traktowana jako broń magiczna z cechą oręża «przebijający zbroję».","page":172},{"name":"Z prochu powstałeś...","tradycja":"Tradycja Nekromancji","pm":26,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"","skladnik":"fiolka wypełniona wodą święconą (+3)","opis":"Nekromanta zaklina moc Dhar, tworząc magiczny wir w dowolnym miejscu do 48 metrów. Połączenie ośmiu Wiatrów Magii wysysa energię ze wszystkich ożywieńców w obszarze. Wszyscy ożywieńcy w promieniu 5 metrów otrzymują trafienie o Sile 5; czar automatycznie niszczy szkielety i zombi.","page":170},{"name":"Zapora ze stali","tradycja":"Tradycja Metalu","pm":5,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"1 minuta (6 rund)","skladnik":"stalowa kula (+1)","opis":"Czarodziej otacza się zaporą wirujących stalowych kul. Wszystkie wymierzone w niego ataki wykonywane są z modyfikatorem -10 do WW lub US.","page":158},{"name":"Zew Vanhela","tradycja":"Tradycja Nekromancji","pm":15,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"","skladnik":"niewielka srebrna trąbka (+2)","opis":"Nekromanta napełnia energią Dhar kontrolowanych przez siebie ożywieńców: 1k10 szkieletów, zombi lub upiorów natychmiast może wykonać akcję «ruch» lub «zwykły atak», nawet poza swoją turą. Jest to akcja natychmiastowa, nieliczona do limitu akcji ożywieńca w danej rundzie.","page":170},{"name":"Ziemia karmicielka","tradycja":"Tradycja Życia","pm":8,"czas_rzucania":"1 minuta","zasieg":"","czas_trwania":"1 tydzień","skladnik":"garść karmy dla zwierząt (+1)","opis":"Dotknięciem dłoni czarodziej napełnia dowolną postać energią Ghyran, niczym zwierzę obrastające w tłuszcz przed snem zimowym. Postać może całkowicie powstrzymać się od jedzenia (musi jednak pić). Czar dotykowy — można na siebie.","page":166},{"name":"Zimowy chłód","tradycja":"Magia kapłańska: Ulryk","pm":5,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"1 minuta (6 rund)","skladnik":"kłębek zwierzęcej sierści (+1)","opis":"Kapłan zaczyna emanować przenikającym do szpiku kości zimnem. W trakcie trwania czaru wszystkie atakujące go postacie otrzymują modyfikator -10 do Walki Wręcz.","page":175},{"name":"Zlodowacenie","tradycja":"Tradycja Życia","pm":25,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"liczba minut równa wartości Magii czarodzieja","skladnik":"fiolka z roztopionym śniegiem ze szczytu górskiego (+3)","opis":"Czarodziej pokrywa grubą warstwą lodu dowolny obszar w odległości do 48 metrów. Wszystkie postacie w promieniu 5 metrów otrzymują trafienie o Sile 4 i muszą zdać test Siły Woli; nieudany = przez 1 rundę bezbronne. Wszyscy poruszają się z połową Szybkości.","page":166},{"name":"Znak kruka","tradycja":"Magia kapłańska: Morr","pm":9,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"1 runda","skladnik":"krucze pióro (+1)","opis":"Kapłan przywołuje symbol Morra — widmowego kruka — który spowija go cieniem śmierci. W trakcie trwania czaru kapłan i wszyscy jego towarzysze w odległości do 12 metrów zadają obrażenia zwiększone o 1.","page":171},{"name":"Zwalczanie trucizny","tradycja":"Magia kapłańska: Shallya","pm":4,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"kieł żmii (+1)","opis":"Dotyk kapłana uzdrawia postać cierpiącą z powodu zatrucia — cały jad w jej ciele natychmiast zostaje zneutralizowany, a efekty ustają. Nie wskrzesza postaci zmarłej od trucizny. Czar dotykowy.","page":173},{"name":"Zwierzęcy szał","tradycja":"Tradycja Zwierząt","pm":19,"czas_rzucania":"2 akcje podwójne","zasieg":"","czas_trwania":"zgodnie z zasadami zdolności szał bojowy","skladnik":"serce wilka (+2)","opis":"Czarodziej wyzwala w sprzymierzeńcach najdziksze instynkty: każda przyjazna postać w odległości do 12 metrów wpada w szał (jak zdolność szał bojowy). Nie działa na zwierzęta.","page":165},{"name":"Łaska Chaosu","tradycja":"Tradycja Chaosu","pm":9,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"1 minuta (6 rund)","skladnik":"amulet z symbolem jednego z bogów Chaosu (+1)","opis":"Czarnoksiężnik zwraca się do Mrocznych Potęg Chaosu z prośbą o błogosławieństwo. W trakcie trwania czaru otrzymuje +10 do Walki Wręcz, Odporności, Siły Woli i Ogłady.","page":168},{"name":"Ślepy traf","tradycja":"Magia kapłańska: Ranald","pm":7,"czas_rzucania":"akcja podwójna","zasieg":"","czas_trwania":"1 minuta (6 rund)","skladnik":"królicza łapka (+1)","opis":"Kapłan obdarza dowolną postać łaską Ranalda: gracz może odwrócić kolejność kostek po jednym teście cechy lub umiejętności (np. wynik 82 zamienić na 28). Czar dotykowy, można na siebie; naraz działa tylko jeden ślepy traf.","page":172},{"name":"Śmiertelny dotyk","tradycja":"Tradycja Nekromancji","pm":13,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"","skladnik":"dłoń mordercy (+2)","opis":"Dotyk nekromanty rani ciało przeciwnika: ofiara traci 1k10 punktów Żywotności, bez względu na Wytrzymałość i noszoną zbroję. Czar dotykowy; nie działa na ożywieńców.","page":170},{"name":"Żar serc","tradycja":"Tradycja Ognia","pm":16,"czas_rzucania":"2 akcje podwójne","zasieg":"","czas_trwania":"10 minut","skladnik":"fiolka z mieszanką krwi i oleju (+2)","opis":"Rozpala gniew w sercach towarzyszy w promieniu 30 metrów: +20 do Siły Woli w testach Strachu i Grozy. Jeśli oddalą się ponad 30 metrów od czarodzieja, czar przestaje na nich działać.","page":161},{"name":"Żar z nieba","tradycja":"Tradycja Życia","pm":12,"czas_rzucania":"akcja","zasieg":"","czas_trwania":"1k10 rund","skladnik":"fiolka wypełniona potem zacnego człowieka (+2)","opis":"Czarodziej sprawia, że wybrany obszar w zasięgu wzroku ogarnia skwar jak w największe lato. Wszystkie postacie w promieniu 5 metrów są niemiłosiernie zmęczone, jakby cały dzień pracowały w upale: -20 do wszystkich testów.","page":166}],"traditions":{"Magia kapłańska: Manann":[{"name":"Błogosławiony rejs","pm":5},{"name":"Oddychanie pod wodą","pm":7},{"name":"Bicz wodny","pm":10},{"name":"Chodzenie po wodzie","pm":14},{"name":"Cisza morska","pm":16},{"name":"Klątwa albatrosa","pm":19}],"Magia kapłańska: Morr":[{"name":"Mumifikacja","pm":5},{"name":"Znak kruka","pm":9},{"name":"Posłaniec ze snu","pm":10},{"name":"Wieczny odpoczynek","pm":13},{"name":"Wizja Morra","pm":15},{"name":"Letarg","pm":20}],"Magia kapłańska: Myrmidia":[{"name":"Włócznia Myrmidii","pm":5},{"name":"Geniusz taktyczny","pm":7},{"name":"Waleczność","pm":10},{"name":"Groza wojny","pm":16},{"name":"Tarcza Myrmidii","pm":20}],"Magia kapłańska: Ranald":[{" const STAT={ww:"WW",us:"US",k:"K",krzepa:"K",odp:"Odp",odpornosc:"Odp",zr:"Zr",zrecznosc:"Zr",
  int:"Int",inteligencja:"Int",sw:"SW","sila woli":"SW",ogd:"Ogd",oglada:"Ogd",a:"A",ataki:"A",

function fold(s){return (s||"").toLowerCase().replace(/ł/g,"l").normalize("NFKD")
  .replace(/[̀-ͯ]/g,"").trim();}
function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function num(v){if(v==null||v==="—")return null;const m=(""+v).match(/-?\d+/);return m?+m[0]:null;}

// indeks wszystkich encji
const IDX=[];
DATA.profs.forEach(o=>IDX.push({t:"profesja",name:o.name,o}));

DATA.items.forEach(o=>IDX.push({t:"ekwipunek",name:o.name,o}));
DATA.bestiary.forEach(o=>IDX.push({t:"potwór",name:o.name,o}));

function statTable(main,sec){
  const cell=(v)=>`<td class="v">${(v==="—"||v==null||v==="")?'<span class="none">—</span>':esc(""+v)}</td>`;
  let h='<table class="stats"><tr>'+MAIN.map(k=>`<td class="k">${k}</td>`).join("")+"</tr><tr>"
    +MAIN.map(k=>cell(main[k])).join("")+"</tr></table>";
  h+='<table class="stats"><tr>'+SEC.map(k=>`<td class="k">${k}</td>`).join("")+"</tr><tr>"
    +SEC.map(k=>cell(sec[SECK[k]||k])).join("")+"</tr></table>";
  return h;
}
function goChips(ok,miss){
  const a=(ok||[]).map(n=>`<span class="chip" data-go="${esc(n)}">${esc(n)}</span>`);
  const b=(miss||[]).map(n=>`<span class="chip miss" title="brak w bazie">${esc(n)}</span>`);
  return '<div class="chips">'+(a.concat(b).join("")||'<span class="txt">brak</span>')+"</div>";
}
function kv(label,val){return val&&val!=="—"?`<span class="kv"><b>${label}:</b> <span>${esc(""+val)}</span></span>`:"";}

  ${statTable(p.main,p.sec)}
  ${p.skills?`<div class="lbl">Umiejętności</div><div class="txt">${esc(p.skills)}</div>`:""}
  ${p.talents?`<div class="lbl">Zdolności</div><div class="txt">${esc(p.talents)}</div>`:""}
  ${p.trappings?`<div class="lbl">Wyposażenie</div><div class="txt">${esc(p.trappings)}</div>`:""}
  <div class="lbl"><span class="arrow">←</span>Wejście z</div>${goChips(p.inOk,p.inMiss)}
  <div class="lbl"><span class="arrow">→</span>Wyjście do</div>${goChips(p.outOk,p.outMiss)}</div>`;}

  <div class="row2">${kv("Obrażenia",w.sila_broni)}${kv("Cena",w.cena)}${kv("Obciążenie",w.obciazenie)}${kv("Kategoria",w.kategoria)}
  ${w.klasa==="strzelecka"?kv("Zasięg",w.zasieg)+kv("Przeładowanie",w.przeladowanie):""}${kv("Dostępność",w.dostepnosc)}</div>
  ${w.cechy&&w.cechy!=="brak"?`<div class="lbl">Cechy oręża</div><div class="txt">${esc(w.cechy)}</div>`:""}</div>`;}

  <div class="row2">${kv("Punkty Zbroi",a.pz)}${kv("Cena",a.cena)}${kv("Obciążenie",a.obciazenie)}${kv("Chronione lokacje",a.lokacje)}${kv("Dostępność",a.dostepnosc)}</div></div>`;}

  <div class="row2">${kv("Poziom mocy",s.pm)}${kv("Czas rzucania",s.czas_rzucania)}${kv("Zasięg",s.zasieg)}${kv("Czas trwania",s.czas_trwania)}${kv("Składnik",s.skladnik)}</div>

function cardTradition(name){const list=DATA.traditions[name];if(!list)return "";
  return `<div class="card"><span class="conf">0.95</span><h2>${esc(name)}</h2>
  <div class="meta">${list.length} czarów wg poziomu mocy<span class="badge q">tradycja · Graf</span></div>
  <div class="chips">${list.map(s=>`<span class="chip" data-go="${esc(s.name)}">PM ${s.pm} · ${esc(s.name)}</span>`).join("")}</div></div>`;}

function cardAbility(name,kind,who){
  const P=who.prof||[],C=who.creat||[];
  return `<div class="card"><span class="conf">graf zależności · 0.85</span>
  <h2>${esc(name)}</h2><div class="meta">${kind}<span class="badge q">zależność · Graf</span></div>
  <div class="lbl">Profesje (${P.length})</div><div class="chips">${P.map(n=>`<span class="chip" data-go="${esc(n)}">${esc(n)}</span>`).join("")||'<span class="txt">—</span>'}</div>
  ${C.length?`<div class="lbl">Potwory (${C.length})</div><div class="chips">${C.map(n=>`<span class="chip" data-go="${esc(n)}">${esc(n)}</span>`).join("")}</div>`:""}</div>`;}

function cardCompare(col,q){
  const big=!/najmniejsz|najni/.test(fold(q));
  const sc=DATA.profs.map(p=>({n:p.name,v:p.main[col]!==undefined&&p.main[col]!=="—"?p.main[col]:(p.sec[SECK[col]||col]),pg:p.page}))
    .map(x=>({...x,k:num(x.v)})).filter(x=>x.k!==null);
  if(!sc.length)return "";
  const ext=big?Math.max(...sc.map(x=>x.k)):Math.min(...sc.map(x=>x.k));
  const win=sc.filter(x=>x.k===ext).sort((a,b)=>a.n.localeCompare(b.n));
  return `<div class="card"><span class="conf">SQL · 0.95</span><h2>${big?"Największa":"Najmniejsza"} modyfikacja: ${esc(col)}</h2>
  <div class="meta"><span class="badge q">porównanie · SQL</span> policzone z tabel, nie z modelu</div>
  <div class="chips">${win.map(x=>`<span class="chip" data-go="${esc(x.n)}">${esc(x.n)} · ${esc(x.v)} (str. ${x.pg})</span>`).join("")}</div></div>`;}

const RENDER={"profesja":cardProf,"broń":cardWeapon,"pancerz":cardArmour,"czar":cardSpell,
  "ekwipunek":cardItem,"potwór":cardBeast};

function matchName(name,f){const fn=fold(name);
  return (f.length>=3&&fn.includes(f))||(fn.length>=3&&f.includes(fn));}

function run(q){
  const out=document.getElementById("out"); q=(q||"").trim();
  if(!q){out.innerHTML='<div class="empty">Wpisz nazwę encji albo pytanie.</div>';return;}
  const f=fold(q); let html="";

  // porównanie cechy
  if(/naj(wi|wy|mnie|ni)/.test(f)){
    let col=null,best=null;
    for(const a in STAT){if(new RegExp("\\b"+a.replace(/ /g,"\\s")+"\\b").test(f)&&(!best||a.length>best)){best=a.length;col=STAT[a];}}
    if(col){out.innerHTML=cardCompare(col,q)||nf();return;}
  }
  // tradycja czarów (dokładne dopasowanie nazwy tradycji)
  const trad=Object.keys(DATA.traditions).find(t=>matchName(t,f)||fold(t).split(/[^a-z]+/).some(w=>w.length>3&&f.includes(w)));
  // zależność: umiejętność/zdolność
  const sk=Object.keys(DATA.skills).find(s=>matchName(s,f));
  const tl=Object.keys(DATA.talents).find(t=>matchName(t,f));
  const askDep=/kto (zna|ma|posiada)|ktore (profesje|klasy|potwory)/.test(f);

  // encje po nazwie
  let hits=IDX.filter(e=>matchName(e.name,f)||(e.base&&matchName(e.base,f)));
  // preferuj krótsze/bliższe nazwy
  hits.sort((a,b)=>Math.abs(fold(a.name).length-f.length)-Math.abs(fold(b.name).length-f.length));

  if(trad&&(/(czar|zaklec|magia|tradycj|modlitw|dziedzin)/.test(f)||!hits.length)) html+=cardTradition(trad);
  if((askDep||sk||tl)){
    if(sk) html+=cardAbility(sk,"umiejętność",DATA.skills[sk]);
    if(tl) html+=cardAbility(tl,"zdolność",DATA.talents[tl]);
  }
  hits.slice(0,8).forEach(e=>{html+=RENDER[e.t](e.o);});

  if(!html) html=nf();
  out.innerHTML=html;
}
function nf(){return `<div class="warnbox">Nie znaleziono w warstwie strukturalnej.
  Prozę, zasady i lore (Warstwa 4 — wektory) obsługuje agent/serwer semantyczny.
  ${DATA.missing.length?`<br><br><b>Znane luki grafu:</b> ${DATA.missing.map(esc).join(", ")}.`:""}</div>`;}

const qi=document.getElementById("q");
qi.addEventListener("input",()=>run(qi.value));
document.addEventListener("click",e=>{const g=e.target.getAttribute&&e.target.getAttribute("data-go");
  if(g){qi.value=g;run(g);window.scrollTo(0,0);qi.focus();}});
document.getElementById("hints").innerHTML=EX.map(x=>`<span class="hint" data-go="${esc(x)}">${esc(x)}</span>`).join("");
const c=DATA.counts;
document.getElementById("foot").innerHTML=`<span class="tcount">${c.profesje}</span> profesji · `
  +`<span class="tcount">${c.broń}</span> broni · <span class="tcount">${c.pancerz}</span> pancerzy · `
  +`<span class="tcount">${c.czary}</span> czarów · <span class="tcount">${c.ekwipunek}</span> ekwipunku · `
  +`<span class="tcount">${c.potwory}</span> potworów · <span class="tcount">${c.umiejętności}</span> umiejętności · `
  +`<span class="tcount">${c.zdolności}</span> zdolności · dane: ${esc(DATA.source)}`;
run("");
